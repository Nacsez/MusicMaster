name: Windows quality and executable

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.7'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.txt
      - name: Prepare pinned Windows environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements/windows-release.txt -r requirements/windows-build.txt -e '.[dev,packaging]'
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed." }
      - name: Audit source candidate
        run: .\scripts\Invoke-PublicationAudit.ps1 -TrackedOnly
      - name: Static quality
        run: .\scripts\Invoke-Quality.ps1
      - name: Generate deterministic audio fixtures
        run: |
          .\.venv\Scripts\python.exe scripts/generate_wav_fixtures.py
          if ($LASTEXITCODE -ne 0) { throw "Fixture generation failed." }
      - name: Full regression suite
        run: .\scripts\Invoke-Tests.ps1 -Tier All -Coverage
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Populated browser workflows
        run: .\scripts\Invoke-PopulatedPortalSmoke.ps1
      - name: Build Windows executable
        run: .\scripts\Build-Windows.ps1
      - name: Exercise actual executable
        run: .\scripts\Invoke-ExecutableSmoke.ps1 -ExecutablePath dist\windows\MusicMasteringTools.exe
      - name: Verify browser-owned executable lifetime
        run: .\scripts\Invoke-BrowserLifecycleSmoke.ps1 -ExecutablePath dist\windows\MusicMasteringTools.exe -IncludeCrashFallback
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-verification
          path: |
            artifacts/tests/*.log
            artifacts/tests/*.xml
            artifacts/coverage/*.xml
            artifacts/windows-build/*/build.log
            artifacts/executable-smoke/*/verification-summary.json
            artifacts/executable-smoke/*/frozen-diagnostics.json
            artifacts/release-audit/*.json
            artifacts/ux-populated-smoke/*/verification-summary.json
            artifacts/ux-populated-smoke/*/browser-audit.json
            artifacts/ux-populated-smoke/*/*.png
            artifacts/browser-lifecycle-smoke/*/verification-summary.json
          if-no-files-found: warn
          retention-days: 14
